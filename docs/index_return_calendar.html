function pctColor(v) {
  if (v === null || v === undefined || isNaN(v)) return 'transparent';
  const strength = Math.min(Math.abs(v) / 2.5, 1.0);
  const alpha = (0.15 + strength * 0.65).toFixed(2);
  if (v > 0) return `rgba(239, 68, 68, ${alpha})`;
  if (v < 0) return `rgba(34, 197, 94, ${alpha})`;
  return '#fafafa';
}

const MONTH_NAMES = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const WEEK_HEADERS = ['周日','周一','周二','周三','周四','周五','周六'];

function monthMatrix(year, month) {
  const first = new Date(year, month - 1, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const weeks = [];
  let week = new Array(startWeekday).fill(0);
  for (let d = 1; d <= daysInMonth; d++) {
    week.push(d);
    if (week.length === 7) { weeks.push(week); week = []; }
  }
  if (week.length) {
    while (week.length < 7) week.push(0);
    weeks.push(week);
  }
  return weeks;
}

function fmtPct(v) { return (v >= 0 ? '+' : '') + v.toFixed(2) + '%'; }

function buildMonthCard(year, month, daily, streakByDate = new Map()) {
  const weeks = monthMatrix(year, month);
  const rets = [];
  let rows = '';
  weeks.forEach(week => {
    let row = '<tr>';
    week.forEach(day => {
      if (day === 0) { row += '<td class="empty"></td>'; return; }
      const key = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const v = daily[key];
      if (v === undefined) {
        row += `<td class="day"><div class="day-num">${day}</div></td>`;
      } else {
        rets.push(v);
        const streak = streakByDate.get(key);
        const tip = streak ? `${streak.start} 至 ${streak.end}，连${streak.direction > 0 ? '涨' : '跌'}${streak.length}天，累计${fmtPct(streak.cumulative)}` : '';
        row += `<td class="day has-val" data-date="${key}" title="${tip}" style="background:${pctColor(v)};"><div class="day-num">${day}</div><div class="day-val">${fmtPct(v)}</div></td>`;
      }
    });
    row += '</tr>';
    rows += row;
  });

  let statHtml = '<div class="month-stat">当月无交易数据</div>';
  if (rets.length) {
    const up = rets.filter(r => r > 0);
    const down = rets.filter(r => r < 0);
    const cum = (rets.reduce((acc, r) => acc * (1 + r / 100), 1) - 1) * 100;
    const avgUp = up.length ? up.reduce((a, b) => a + b, 0) / up.length : 0;
    const avgDown = down.length ? down.reduce((a, b) => a + b, 0) / down.length : 0;
    const color = cum > 0 ? '#dc2626' : (cum < 0 ? '#16a34a' : '#6b7280');
    statHtml = `<div class="month-stat" style="color:${color}">累计:${fmtPct(cum)} | 上涨${up.length}天 | 下跌${down.length}天</div>
                <div class="month-stat sub">平均涨幅${fmtPct(avgUp)} | 平均跌幅${fmtPct(avgDown)}</div>`;
  }

  return `<div class="month-card">
    <div class="month-header">${year}年${month}月</div>
    <table class="month-table">
      <thead><tr>${WEEK_HEADERS.map((h, i) => `<th class="${i === 0 || i === 6 ? 'weekend' : ''}">${h}</th>`).join('')}</tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${statHtml}
  </div>`;
}

function buildStatsRows(entries) {
  return entries.map(({ label, vals }) => {
    const total = vals.length;
    const up = vals.filter(v => v > 0).length;
    const down = vals.filter(v => v < 0).length;
    const upProb = total ? (up / total * 100).toFixed(1) + '%' : '0.0%';
    const avg = total ? vals.reduce((a, b) => a + b, 0) / total : 0;
    const avgColor = avg > 0 ? '#dc2626' : (avg < 0 ? '#16a34a' : '#374151');
    return `<tr><td>${label}</td><td>${total}</td><td>${up}</td><td>${down}</td><td>${upProb}</td>
             <td style="color:${avgColor};font-weight:bold;">${total ? fmtPct(avg) : '0.00%'}</td></tr>`;
  }).join('');
}

// 按日期排序后，以相邻交易记录构成连续段；平盘中断，休市日不打断。
// 每段只计一次，包含年内首尾截断的段，长度只统计当前年份内的交易日。
function buildStreakDistribution(daily) {
  const counts = new Map(), runs = [];
  let direction = 0, dates = [], product = 1;
  let upRuns = 0, downRuns = 0, maxUp = 0, maxDown = 0;
  let sampleDays = 0, flatDays = 0;
  function flush(ended = true) {
    const length = dates.length;
    if (!length) return;
    counts.set(direction * length, (counts.get(direction * length) || 0) + 1);
    runs.push({ direction, length, dates, start: dates[0], end: dates[length - 1],
      cumulative: (product - 1) * 100, ended });
    if (direction > 0) { upRuns++; maxUp = Math.max(maxUp, length); }
    else { downRuns++; maxDown = Math.max(maxDown, length); }
    direction = 0; dates = []; product = 1;
  }
  Object.entries(daily).sort(([a], [b]) => a.localeCompare(b)).forEach(([date, value]) => {
    // 缺失记录不能证明前一段已结束；平盘或反向交易日才能证明。
    if (!Number.isFinite(value)) { flush(false); return; }
    sampleDays++;
    const sign = Math.sign(value);
    if (!sign) { flatDays++; flush(); return; }
    if (sign !== direction) { flush(); direction = sign; }
    dates.push(date);
    product *= 1 + value / 100;
  });
  flush(false);
  return { counts, runs, upRuns, downRuns, maxUp, maxDown, sampleDays, flatDays };
}

    svg += `<g><title>${label}</title><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${color}" stroke-width="4" stroke-linecap="round"/><circle cx="${(x1 + x2) / 2}" cy="${y}" r="4" fill="${color}"/></g>`;
  });
  svg += `<line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${H - m.b}" stroke="#111827"/><line x1="${m.l}" y1="${H - m.b}" x2="${W - m.r}" y2="${H - m.b}" stroke="#111827"/>`;
  svg += `<text x="${m.l + pw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#1f2937">年内交易日位置</text><text transform="translate(13 ${m.t + ph / 2}) rotate(-90)" text-anchor="middle" font-size="11" fill="#1f2937">每段累计涨跌幅</text></svg>`;
  details.innerHTML = `<h4>${title}</h4><div class="ret-dist-cap">红色为连涨，蓝色为连跌；横线表示每段覆盖的交易日，悬停查看天数和累计幅度。点击左侧分布柱筛选并高亮日历。</div>` +
    '<div><button type="button" id="streak-reset">显示全部连涨／连跌段</button></div>' +
    (chosen.length ? `<div class="streak-location-chart">${svg}</div>` : '<div class="rank-empty">暂无对应记录</div>');
  document.getElementById('streak-reset').onclick = () => renderStreakDetails(runs);
}

function renderStreakExtras(runs) {
  const box = document.getElementById('ret-dist');
  const average = items => items.length ? fmtPct(items.reduce((sum, r) => sum + r.cumulative, 0) / items.length) : '暂无样本';
  const lengths = [...new Set(runs.map(r => r.length))].sort((a, b) => a - b);
  box.insertAdjacentHTML('beforeend', '<h4 class="ret-dist-title">平均连涨／连跌幅度</h4>' +
    '<div class="ret-dist-cap">每段先复利累计，再按段等权平均；与分布图一致，包含单日段和年内首尾截断段。</div>' +
    '<table><thead><tr><th>连续天数</th><th>连涨段数</th><th>平均累计涨幅</th><th>连跌段数</th><th>平均累计跌幅</th></tr></thead><tbody>' +
    [null, ...lengths].map(n => {
      const up = runs.filter(r => r.direction > 0 && (n === null || r.length === n));
      const down = runs.filter(r => r.direction < 0 && (n === null || r.length === n));
      return `<tr><td>${n === null ? '全部段' : n + '天'}</td><td>${up.length}</td><td>${average(up)}</td><td>${down.length}</td><td>${average(down)}</td></tr>`;
    }).join('') + '</tbody></table>');
  box.querySelectorAll('[data-streak-days]').forEach(bar => {
    const select = () => renderStreakDetails(runs, Number(bar.dataset.streakDays));
    bar.addEventListener('click', select);
    bar.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(); } });
  });
  renderStreakDetails(runs);
}

function renderStreakDist(daily) {
  const box = document.getElementById('ret-dist');
  if (!box) return;
  window._lastStreakDaily = daily;
  const { counts, runs, upRuns, downRuns, maxUp, maxDown, sampleDays, flatDays } = buildStreakDistribution(daily);
  if (!sampleDays) { box.innerHTML = '<div class="rank-empty">暂无数据</div>'; renderStreakDetails([]); return; }
  const caption = `<div class="ret-dist-cap">样本 ${sampleDays} 个交易日｜连涨 ${upRuns} 段｜连跌 ${downRuns} 段｜最长连涨 ${maxUp} 天｜最长连跌 ${maxDown} 天｜平盘 ${flatDays} 天</div>` +
    '<div class="ret-dist-cap">每段计一次，含单日段和年内首尾段；仅统计本年交易日，平盘中断，休市不打断。</div>';
  if (!counts.size) { box.innerHTML = caption + '<div class="rank-empty">本年均为平盘，无连涨／连跌段</div>'; renderStreakExtras(runs); return; }

  // 一根柱对应一个整数天数，负数为连跌，正数为连涨，不含 0。
  const bins = [];
  for (let n = -maxDown; n < 0; n++) bins.push(n);
  for (let n = 1; n <= maxUp; n++) bins.push(n);
  const maxC = Math.max(...counts.values());
  const tickStep = maxC <= 5 ? 1 : maxC <= 10 ? 2 : maxC <= 25 ? 5 : maxC <= 50 ? 10 : Math.ceil(maxC / 100) * 20;
  const yMax = Math.ceil(maxC * 1.1 / tickStep) * tickStep;
  const W = Math.max(box.clientWidth || 560, 300), H = 280;
  const m = { l: 40, r: 12, t: 22, b: 44 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const bw = pw / bins.length;
  const yOf = c => m.t + ph - c / yMax * ph;

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif">`;
  for (let t = 0; t <= yMax; t += tickStep) {
    const y = yOf(t);
    svg += `<line x1="${m.l}" y1="${y}" x2="${W - m.r}" y2="${y}" stroke="#e5e7eb" stroke-dasharray="3,3"/>`;
    svg += `<text x="${m.l - 6}" y="${y + 3}" font-size="10" fill="#4b5563" text-anchor="end">${t}</text>`;
  }
  const skip = bw < 22 ? Math.ceil(22 / bw) : 1;
  bins.forEach((days, k) => {
    const c = counts.get(days) || 0;
    const x = m.l + k * bw + bw * 0.1, w = bw * 0.8;
    const cx = x + w / 2;
    const label = `连${days > 0 ? '涨' : '跌'} ${Math.abs(days)} 天：${c} 次`;
    if (c > 0) {
      const y = yOf(c);
      svg += `<rect data-streak-days="${days}" tabindex="0" role="button" aria-label="${label}，查看出现日期" style="cursor:pointer" x="${x}" y="${y}" width="${w}" height="${m.t + ph - y}" fill="${days > 0 ? '#ff6b6b' : '#66b3ff'}"><title>${label}</title></rect>`;
      svg += `<text x="${cx}" y="${y - 4}" font-size="10" fill="#1f2937" text-anchor="middle">${c}</text>`;
    }
    svg += `<line x1="${cx}" y1="${m.t + ph}" x2="${cx}" y2="${m.t + ph + 4}" stroke="#6b7280"/>`;
    if (k % skip === 0 || Math.abs(days) === 1 || k === bins.length - 1) svg += `<text x="${cx}" y="${m.t + ph + 16}" font-size="10" fill="#4b5563" text-anchor="middle">${days}</text>`;
  });
  if (maxDown && maxUp) {
    const x0 = m.l + maxDown * bw;
    svg += `<line x1="${x0}" y1="${m.t}" x2="${x0}" y2="${m.t + ph}" stroke="#9ca3af" stroke-dasharray="4,3"/>`;
  }
  svg += `<line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${m.t + ph}" stroke="#111827"/>`;
  svg += `<line x1="${m.l}" y1="${m.t + ph}" x2="${W - m.r}" y2="${m.t + ph}" stroke="#111827"/>`;
  svg += `<text x="${m.l + pw / 2}" y="${H - 6}" font-size="11" fill="#1f2937" text-anchor="middle">连续交易天数（负数为连跌，正数为连涨）</text>`;
  svg += `<text transform="translate(11 ${m.t + ph / 2}) rotate(-90)" font-size="11" fill="#1f2937" text-anchor="middle">出现次数</text>`;
  svg += '</svg>';
  box.innerHTML = caption + svg;
  renderStreakExtras(runs);
}

window.addEventListener('resize', () => { if (window._lastStreakDaily) renderStreakDist(window._lastStreakDaily); });

function renderAll() {
  const entity = DATA.entities.find(e => e.id === currentEntity);
  if (!entity) return;
  const years = Object.keys(entity.years).sort().reverse();
  if (!currentYear || !entity.years[currentYear]) currentYear = years[0];

  const yearGroup = document.getElementById('year-group');
  yearGroup.innerHTML = years.map(y => `<button class="year-btn ${y === currentYear ? 'active' : ''}" data-year="${y}">${y}</button>`).join('');
  yearGroup.querySelectorAll('.year-btn').forEach(btn => {
    btn.addEventListener('click', function () { currentYear = this.dataset.year; renderAll(); if (currentView === 'ranking') renderRanking(); });
  });

  document.getElementById('entity-title').textContent = `${entity.name}（${entity.category}） - ${currentYear}年 收益日历`;

  const daily = entity.years[currentYear];
  const streakByDate = new Map();
  buildStreakDistribution(daily).runs.filter(r => r.length >= 2).forEach(r => r.dates.forEach(d => streakByDate.set(d, r)));
  let calHtml = '';
  for (let m = 1; m <= 12; m++) calHtml += buildMonthCard(parseInt(currentYear, 10), m, daily, streakByDate);
  document.getElementById('calendar-grid').innerHTML = calHtml;

  const wdNames = { 1: '星期一', 2: '星期二', 3: '星期三', 4: '星期四', 5: '星期五' };
  const weekdayEntries = [];
  for (let wd = 1; wd <= 5; wd++) {
    const vals = Object.entries(daily).filter(([d]) => {
      const jsWd = new Date(d + 'T00:00:00').getDay();
      const iso = jsWd === 0 ? 7 : jsWd;
      return iso === wd;
    }).map(([, v]) => v);
    weekdayEntries.push({ label: wdNames[wd], vals });
  }
  document.getElementById('weekday-table').innerHTML =
    '<thead><tr><th>星期</th><th>交易天数</th><th>上涨天数</th><th>下跌天数</th><th>上涨概率</th><th>平均涨跌幅</th></tr></thead><tbody>' +
    buildStatsRows(weekdayEntries) + '</tbody>';

  const monthEntries = [];
  for (let m = 1; m <= 12; m++) {
    const prefix = `${currentYear}-${String(m).padStart(2, '0')}-`;
    const vals = Object.entries(daily).filter(([d]) => d.startsWith(prefix)).map(([, v]) => v);
    monthEntries.push({ label: `${m}月`, vals });
  }
  document.getElementById('month-table').innerHTML =
    '<thead><tr><th>月份</th><th>交易天数</th><th>上涨天数</th><th>下跌天数</th><th>上涨概率</th><th>平均涨跌幅</th></tr></thead><tbody>' +
    buildStatsRows(monthEntries) + '</tbody>';

  renderStreakDist(daily);
}

function setCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.category-btn').forEach(b => b.classList.toggle('active', b.dataset.category === cat));
  document.querySelectorAll('.entity-btn').forEach(b => b.classList.toggle('hidden', !(cat === '__ALL__' || b.dataset.category === cat)));
  const visible = Array.from(document.querySelectorAll('.entity-btn:not(.hidden)'));
  if (visible.length && !visible.some(b => b.dataset.id === currentEntity)) setEntity(visible[0].dataset.id);
  if (currentView === 'ranking') renderRanking();
}

// ==================== 月度收益排名看板 ====================
function monthColor(v) {
  if (v === null || v === undefined || isNaN(v)) return 'transparent';
  const strength = Math.min(Math.abs(v) / 8.0, 1.0);  
  const alpha = (0.15 + strength * 0.65).toFixed(2);
  if (v > 0) return `rgba(239, 68, 68, ${alpha})`;
  if (v < 0) return `rgba(34, 197, 94, ${alpha})`;
  return '#fafafa';
}

function buildRankingBoard(category, year) {
  const pool = DATA.entities.filter(e => (category === '__ALL__' || e.category === category) && e.years[year]);
  if (!pool.length) return '<div class="rank-empty">当前分类/年份下没有数据</div>';

  const monthsSet = new Set();
  pool.forEach(e => Object.keys(e.years[year]).forEach(d => monthsSet.add(parseInt(d.slice(5, 7), 10))));
  const months = Array.from(monthsSet).sort((a, b) => a - b);
  if (!months.length) return '<div class="rank-empty">当前分类/年份下没有数据</div>';
  const latestMonth = months[months.length - 1];

  const rows = pool.map(e => {
    const daily = e.years[year];
    const perMonth = {};
    months.forEach(m => {
      const prefix = `${year}-${String(m).padStart(2, '0')}-`;
      const vals = Object.entries(daily).filter(([d]) => d.startsWith(prefix)).map(([, v]) => v);
      perMonth[m] = vals.length ? (vals.reduce((acc, r) => acc * (1 + r / 100), 1) - 1) * 100 : null;
    });
    return { id: e.id, name: e.name, category: e.category, perMonth };
  });

  rows.sort((a, b) => {
    const av = a.perMonth[latestMonth], bv = b.perMonth[latestMonth];
    if (av === null && bv === null) return 0;
    if (av === null) return 1;
    if (bv === null) return -1;
    return bv - av;
  });

  const monthStats = {};
  months.forEach(m => {
    const vals = rows.map(r => r.perMonth[m]).filter(v => v !== null && v !== undefined);
    const up = vals.filter(v => v > 0).length;
    const down = vals.filter(v => v < 0).length;
    const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
    const range = vals.length ? Math.max(...vals) - Math.min(...vals) : 0;
    monthStats[m] = { up, down, avg, range };
  });

  const thead = '<tr><th>排名</th><th>代码</th><th>名称</th><th>分类</th>' +
    months.map(m => {
      const st = monthStats[m];
      return `<th>${m}月<div class="rank-month-sub">↑${st.up} ↓${st.down}<br>均${fmtPct(st.avg)}<br>差${st.range.toFixed(2)}%</div></th>`;
    }).join('') + '</tr>';

  const tbody = rows.map((r, idx) => {
    const cells = months.map(m => {
      const v = r.perMonth[m];
      if (v === null || v === undefined) return '<td class="rank-na">-</td>';
      return `<td style="background:${monthColor(v)};">${fmtPct(v)}</td>`;
    }).join('');
    return `<tr><td class="rank-rank ${idx < 3 ? 'rank-top' : ''}">${idx + 1}</td><td>${r.id}</td>` +
           `<td class="rank-name">${r.name}</td><td>${r.category}</td>${cells}</tr>`;
  }).join('');

  return `<div class="rank-table-wrap"><table class="rank-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table></div>`;
}

function renderRanking() {
  const years = Array.from(new Set(DATA.entities.flatMap(e => Object.keys(e.years)))).sort().reverse();
  if (!currentYear || !years.includes(currentYear)) currentYear = years[0];
  const label = currentCategory === '__ALL__' ? '全部分类' : currentCategory;
  document.getElementById('ranking-title').textContent = `${label} - ${currentYear}年 月度收益排名看板`;
  document.getElementById('ranking-board').innerHTML = buildRankingBoard(currentCategory, currentYear);
}

function setView(view) {
  currentView = view;
  document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.getElementById('calendar-view').classList.toggle('hidden', view !== 'calendar');
  document.getElementById('ranking-view').classList.toggle('hidden', view !== 'ranking');
  document.getElementById('entity-bar').classList.toggle('hidden', view !== 'calendar');
  if (view === 'ranking') renderRanking();
}

function setEntity(id) {
  currentEntity = id;
  currentYear = null;
  document.querySelectorAll('.entity-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  renderAll();
}

document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.category-btn').forEach(btn => btn.addEventListener('click', function () { setCategory(this.dataset.category); }));
  document.querySelectorAll('.entity-btn').forEach(btn => btn.addEventListener('click', function () { setEntity(this.dataset.id); }));
  document.querySelectorAll('.view-btn').forEach(btn => btn.addEventListener('click', function () { setView(this.dataset.view); }));
  if (DATA.entities.length) setEntity(DATA.entities[0].id);

  const btnScreenshot = document.getElementById('btn-screenshot');
  btnScreenshot.addEventListener('click', function () {
    const target = document.getElementById('capture-area');
    if (typeof html2canvas === 'undefined') { alert('截图组件加载失败，请检查网络连接后重试'); return; }
    btnScreenshot.disabled = true;
    btnScreenshot.textContent = '⏳ 正在生成截图...';
    html2canvas(target, { backgroundColor: '#f6f7f9', scale: window.devicePixelRatio > 1 ? 2 : 1, useCORS: true }).then(canvas => {
      const link = document.createElement('a');
      const ts = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      link.download = 'return_calendar_' + ts + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      btnScreenshot.disabled = false;
      btnScreenshot.textContent = '📷 保存截图';
    }).catch(err => {
      console.error(err); alert('截图失败，请稍后重试');
      btnScreenshot.disabled = false; btnScreenshot.textContent = '📷 保存截图';
    });
  });
});
</script>
