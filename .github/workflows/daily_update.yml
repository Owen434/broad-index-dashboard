name: Daily data update

on:
  schedule:
    # UTC 时间。北京时间 = UTC + 8
    - cron: '23 15 * * *'

  workflow_dispatch:

concurrency:
  group: daily-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync with remote before generating
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache CJK fonts
        id: font-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts
          key: cjk-fonts-noto-v1

      - name: Install CJK fonts
        if: steps.font-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "Font install attempt ${attempt}/5"

            if sudo apt-get \
                 -o Acquire::Retries=3 \
                 -o Acquire::http::Timeout=30 \
                 -o Acquire::https::Timeout=30 \
                 update \
               && sudo apt-get \
                 -o Acquire::Retries=3 \
                 -o Acquire::http::Timeout=30 \
                 -o Acquire::https::Timeout=30 \
                 install -y --no-install-recommends fonts-noto-cjk; then
              echo "Font install succeeded"
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Font install failed after 5 attempts"
              exit 1
            fi

            sleep $((attempt * 10))
          done

          mkdir -p ~/.local/share/fonts
          cp /usr/share/fonts/opentype/noto/*.ttc ~/.local/share/fonts/
          ls -la ~/.local/share/fonts/

      - name: Refresh font cache
        shell: bash
        run: |
          set -euo pipefail

          ls ~/.local/share/fonts/*.ttc

          fc-cache -f
          fc-list | grep -i "Noto Sans CJK" | head

      - name: Install dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve Beijing time
        id: bjt
        run: |
          set -euo pipefail

          echo "day=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

      - name: Restore ETF share cache
        uses: actions/cache@v4
        with:
          path: etf/cache_etf
          key: etf-cache-${{ steps.bjt.outputs.day }}-${{ github.run_id }}
          restore-keys: |
            etf-cache-${{ steps.bjt.outputs.day }}-
            etf-cache-

      - name: Restore CFFEX rank cache
        uses: actions/cache@v4
        with:
          path: futures/output_cffex/cffex_rank_raw.parquet
          key: cffex-cache-${{ steps.bjt.outputs.day }}-${{ github.run_id }}
          restore-keys: |
            cffex-cache-${{ steps.bjt.outputs.day }}-
            cffex-cache-

      - name: Restore fund index cache
        uses: actions/cache@v4
        with:
          path: funds/index_cache
          key: fund-index-cache-${{ steps.bjt.outputs.day }}-${{ github.run_id }}
          restore-keys: |
            fund-index-cache-${{ steps.bjt.outputs.day }}-
            fund-index-cache-

      # 不重试，任一脚本报错 → 立即终止，后续脚本不再执行，整个工作流失败。
      # 失败后请在 Actions 页面手动点击 Re-run 重试。
      - name: Run all data scripts
        shell: bash
        run: |
          set -euo pipefail

          run_python() {
            local workdir="$1"
            local script="$2"
            shift 2

            echo "========================================"
            echo "Running ${workdir}/${script}"

            (cd "$workdir" && python "$script" "$@")
          }

          run_python gold gold_ma_slope_analyzer.py

          run_python etf etf_broadbase_dashboard.py

          run_python etf etf_net_flow_calendar.py

          run_python funds fetch_fund_nav.py
          run_python funds fund_indicators_matrix.py
          run_python funds fund_score_matrix.py
          run_python funds fund_riskrank_percentile.py
          run_python funds holdings_calendar.py

          run_python funds fund_correlation_report.py

          run_python funds fund_anomaly_analysis.py

          run_python drawdown drawdown_backtest.py \
            --funds-csv ../funds/funds_universe_example.csv \
            --nav-csv ../funds/fund_nav_history.csv \
            --out drawdown_dashboard.html \
            --plotly-js cdn

          run_python stocks stock_analysis_suite.py

          run_python stocks index_return_calendar.py

          run_python futures cffex_net_position.py

          run_python summary daily_summary.py

          echo "All data scripts completed successfully."

      - name: Collect HTML outputs into docs
        run: |
          set -euo pipefail

          mkdir -p docs

          find . \
            -maxdepth 3 \
            -name "*.html" \
            -not -path "./docs/*" \
            -exec cp {} docs/ \;

          ls -la docs/

      - name: Backup generated files
        run: |
          set -euo pipefail

          rm -rf /tmp/generated_docs
          mkdir -p /tmp/generated_docs

          find docs \
            -maxdepth 1 \
            -type f \
            -name "*.html" \
            -exec cp {} /tmp/generated_docs/ \;

          cp README.md /tmp/generated_README.md

      - name: Sync remote safely
        run: |
          set -euo pipefail

          git fetch origin main
          git reset --hard origin/main

          cp -a /tmp/generated_docs/. docs/
          cp /tmp/generated_README.md README.md

      - name: Commit and push docs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自动更新每日数据看板 ${{ steps.bjt.outputs.stamp }}"
          file_pattern: "docs/** README.md"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: Owen434 <128884918+Owen434@users.noreply.github.com>
