name: Daily data update

on:
  schedule:
    # UTC 时间。北京时间 = UTC + 8
    - cron: '23 15 * * *'

  workflow_dispatch:

concurrency:
  group: daily-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 先同步远程分支，再开始生成文件
      - name: Sync with remote before generating
        run: |
          set -e

          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ========== 中文字体：缓存字体文件，命中后不再使用 apt ==========
      - name: Cache CJK fonts
        id: font-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/fonts
          key: cjk-fonts-noto-v1

      - name: Install CJK fonts (only on cache miss)
        if: steps.font-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # update + install 放在同一个重试单元里，任何一步失败都会整体重试
          for attempt in 1 2 3; do
            echo "Font install attempt ${attempt}/5"

            if sudo apt-get \
                 -o Acquire::Retries=3 \
                 -o Acquire::http::Timeout=30 \
                 -o Acquire::https::Timeout=30 \
                 update \
               && sudo apt-get \
                 -o Acquire::Retries=3 \
                 -o Acquire::http::Timeout=30 \
                 -o Acquire::https::Timeout=30 \
                 install -y --no-install-recommends fonts-noto-cjk; then
              echo "Font install succeeded"
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Font install failed after 5 attempts"
              exit 1
            fi

            sleep $((attempt * 10))
          done

          # 把字体复制到用户目录，供 actions/cache 保存
          mkdir -p ~/.local/share/fonts
          cp /usr/share/fonts/opentype/noto/*.ttc ~/.local/share/fonts/
          ls -la ~/.local/share/fonts/

      - name: Refresh font cache
        shell: bash
        run: |
          set -euo pipefail

          # 确认字体文件确实存在
          ls ~/.local/share/fonts/*.ttc

          fc-cache -f
          fc-list | grep -i "Noto Sans CJK" | head
      # ================================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve Beijing time
        id: bjt
        run: |
          echo "day=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

      - name: Restore ETF share cache
        uses: actions/cache@v4
        with:
          path: etf/cache_etf
          key: etf-cache-${{ steps.bjt.outputs.day }}-${{ github.run_id }}
          restore-keys: |
            etf-cache-${{ steps.bjt.outputs.day }}-
            etf-cache-

      - name: Restore CFFEX rank cache
        uses: actions/cache@v4
        with:
          path: futures/output_cffex/cffex_rank_raw.parquet
          key: cffex-cache-${{ steps.bjt.outputs.day }}-${{ github.run_id }}
          restore-keys: |
            cffex-cache-${{ steps.bjt.outputs.day }}-
            cffex-cache-

      - name: Restore fund index cache
        uses: actions/cache@v4
        with:
          path: funds/index_cache
          key: fund-index-cache-${{ steps.bjt.outputs.day }}-${{ github.run_id }}
          restore-keys: |
            fund-index-cache-${{ steps.bjt.outputs.day }}-
            fund-index-cache-

      - name: Run gold slope analyzer
        working-directory: gold
        run: python gold_ma_slope_analyzer.py
        continue-on-error: true

      - name: Run ETF broad-base dashboard
        working-directory: etf
        run: python etf_broadbase_dashboard.py
        continue-on-error: true

      - name: Run ETF net-flow calendar
        working-directory: etf
        run: python etf_net_flow_calendar.py
        continue-on-error: true

      - name: Run fund indicator scripts
        working-directory: funds
        run: |
          python fetch_fund_nav.py
          python fund_indicators_matrix.py
          python fund_score_matrix.py
          python fund_riskrank_percentile.py
          python holdings_calendar.py
        continue-on-error: true

      - name: Run fund correlation report
        working-directory: funds
        run: python fund_correlation_report.py
        continue-on-error: true

      - name: Run fund anomaly analysis
        working-directory: funds
        run: python fund_anomaly_analysis.py
        continue-on-error: true

      - name: Run drawdown backtest dashboard
        working-directory: drawdown
        run: >-
          python drawdown_backtest.py
          --funds-csv ../funds/funds_universe_example.csv
          --nav-csv ../funds/fund_nav_history.csv
          --out drawdown_dashboard.html
          --plotly-js cdn
        continue-on-error: true

      - name: Run stock analysis suite
        working-directory: stocks
        run: python stock_analysis_suite.py
        continue-on-error: true

      - name: Run index return calendar
        working-directory: stocks
        run: python index_return_calendar.py
        continue-on-error: true

      - name: Run CFFEX net position report
        working-directory: futures
        run: python cffex_net_position.py
        continue-on-error: true

      - name: Build daily summary card
        working-directory: summary
        run: python daily_summary.py
        continue-on-error: true

      - name: Collect HTML outputs into docs
        run: |
          set -e

          mkdir -p docs

          find . \
            -maxdepth 3 \
            -name "*.html" \
            -not -path "./docs/*" \
            -exec cp {} docs/ \;

          ls -la docs/

      # 备份本次生成的文件
      - name: Backup generated files
        run: |
          set -e

          rm -rf /tmp/generated_docs
          mkdir -p /tmp/generated_docs

          find docs \
            -maxdepth 1 \
            -type f \
            -name "*.html" \
            -exec cp {} /tmp/generated_docs/ \;

          cp README.md /tmp/generated_README.md

      # 同步远程分支，避免 rebase --autostash 产生冲突
      - name: Sync remote safely
        run: |
          set -e

          git fetch origin main
          git reset --hard origin/main

          cp -a /tmp/generated_docs/. docs/
          cp /tmp/generated_README.md README.md

      - name: Commit and push docs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自动更新每日数据看板 ${{ steps.bjt.outputs.stamp }}"
          file_pattern: "docs/** README.md"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: Owen434 <128884918+Owen434@users.noreply.github.com>
