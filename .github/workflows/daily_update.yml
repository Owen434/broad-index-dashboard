name: Daily data update

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:   # 允许在 GitHub 网页上手动触发

# 避免手动触发和定时任务同时跑、或者跑的过程中仓库又被别的提交改动，
# 导致最后 push 的时候 "non-fast-forward" 报错
concurrency:
  group: daily-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 汇总图片里全是中文。runner 默认没有中文字体，matplotlib 会把汉字画成方块。
      - name: Install CJK fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 上交所份额只能按日取，5 年 ≈ 1200 次请求。不缓存的话每天重跑一遍，
      # 必然被限流 —— 这正是 docs/ 里 5xxxxx 全部"无份额数据"的直接原因。
      - name: Restore ETF share cache
        uses: actions/cache@v4
        with:
          path: etf/cache_etf
          key: etf-cache-${{ github.run_id }}
          restore-keys: |
            etf-cache-

      - name: Run gold slope analyzer
        working-directory: gold
        run: python gold_ma_slope_analyzer.py
        continue-on-error: true   # 单个数据源抽风不该拖垮整条流水线

      - name: Run ETF broad-base dashboard
        working-directory: etf
        run: python etf_broadbase_dashboard.py
        continue-on-error: true

      - name: Run fund indicator scripts
        working-directory: funds
        run: |
          python fetch_fund_nav.py
          python fund_indicators_matrix.py
          python fund_score_matrix.py
          python fund_riskrank_percentile.py
        continue-on-error: true

      - name: Run stock analysis suite (broad indices only)
        working-directory: stocks
        run: python stock_analysis_suite.py
        continue-on-error: true

      # 必须排在上面四步之后：它读的是它们落下来的 parquet / csv
      - name: Build daily summary card
        working-directory: summary
        run: python daily_summary.py
        continue-on-error: true

      - name: Collect HTML outputs into docs/
        run: |
          mkdir -p docs
          find . -maxdepth 3 -name "*.html" -not -path "./docs/*" -exec cp {} docs/ \;
          ls -la docs/

      - name: Sync with remote before committing
        # 自动暂存生成的文档，拉取最新代码，然后再将文档应用回来
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase --autostash origin/main
        continue-on-error: true

      - name: Commit and push docs/
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自动更新每日数据看板 [skip ci]"
          # README 里的"今日风险速览"那段也是每天重写的, 不加进来就永远停在第一次
          file_pattern: "docs/** README.md"
