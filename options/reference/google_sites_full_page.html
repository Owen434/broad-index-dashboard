    function computeStressIndex(s) {
      // 波动率与挤兑 (25分)
      const vixScore = clamp(((s.vix - 14) / (36 - 14)) * 15, 0, 15);
      const vvixScore = clamp(((s.vvix - 85) / (135 - 85)) * 10, 0, 10);

      // 期限结构倒挂 (15分)
      const termScore1 = clamp(((s.vixVxv - 0.88) / (1.12 - 0.88)) * 9, 0, 9);
      const termScore2 = clamp(((s.vix9dVix - 0.88) / (1.12 - 0.88)) * 6, 0, 6);

      // 做市商负敞口 (30分)
      const gexScore = clamp(((20 - s.spxGex) / 140) * 12, 0, 12);
      const dealerScore = clamp(((1 - s.dealerGamma) / 10) * 10, 0, 10);
      const deltaScore = clamp(((20 - s.netDelta) / 160) * 8, 0, 8);

      // 离散平仓 (15分)
      const dispScore = clamp(((2.5 - s.vixeqVix) / (2.5 - 1.35)) * 15, 0, 15);

      // 期权流量扩散 (15分)
      const pcEqScore = clamp(((s.pcEquity - 0.50) / (0.90 - 0.50)) * 6, 0, 6);
      const pcTotScore = clamp(((s.pcTotal - 0.80) / (1.35 - 0.80)) * 5, 0, 5);
      const pcIdxScore = clamp(((s.pcIndex - 1.00) / (1.40 - 1.00)) * 4, 0, 4);

      const total = vixScore + vvixScore + termScore1 + termScore2 + gexScore + dealerScore + deltaScore + dispScore + pcEqScore + pcTotScore + pcIdxScore;
      return Math.round(clamp(total, 0, 100));
    }

    // 5. 自动判定当前所处四阶段
    function detectRegime(s) {

      // 阶段三：深度负 Gamma 或 VIX 破 26 且伴随期限倒挂/VVIX 飙升
      if (
        (s.vix &gt;= 26.0 &amp;&amp; (s.vixVxv &gt;= 1.00 || s.vvix &gt;= 110)) ||
        (s.dealerGamma &lt;= -4.5 &amp;&amp; s.spxGex &lt;= -50)
      ) {
        return {
          stage: 3,
          title: macroDefense
            ? &#39;阶段三升级：Vanna 踩踏与宏观全面防御&#39;
            : &#39;阶段三：负反馈翻转与 Vanna 踩踏加速期&#39;,
          color: &#39;red&#39;,
          macroDefense
        };
      }

      // 阶段一：正 Gamma 稳态、低波、低流量防御
      if (
        s.dealerGamma &gt;= 1.5 &amp;&amp;
        s.spxGex &gt;= 25 &amp;&amp;
        s.vix &lt; 18.0 &amp;&amp;
        s.skew &lt; 158

        return {
          stage: 1,
          title: &#39;阶段一：缩圈与离散稳态期&#39;,
          color: &#39;green&#39;,
          macroDefense: false
        };

        s.vixVxv &lt; 1.00 &amp;&amp;
        s.vvix &lt; 110 &amp;&amp;
        s.skew &lt; 155 &amp;&amp;
        s.netDelta &gt;= 0 &amp;&amp;
        s.spxGex &lt; 25 &amp;&amp;
        s.vixeqVix &lt; 2.0

        return {
          stage: 4,
          title: &#39;阶段四：极端出清与反向 Vanna 修复期&#39;,
          color: &#39;blue&#39;,
          macroDefense: false
        };
      }

      // 阶段二：偏度飙升预警 / 个股 P/C 率先抬头 / 临近 Gamma Flip
      return {
        stage: 2,
        title: &#39;阶段二：拥挤见顶与先遣撤退期&#39;,
        color: &#39;amber&#39;,
        macroDefense: false

                  &lt;span id=&quot;badge-${item.key}&quot; class=&quot;text-[10px] font-semibold px-1.5 py-0.5 rounded border whitespace-nowrap w-14 text-center&quot;&gt;--&lt;/span&gt;
                &lt;/div&gt;

              &lt;input
                id=&quot;range-${item.key}&quot;
                data-key=&quot;${item.key}&quot;
                type=&quot;range&quot;
                min=&quot;${item.min}&quot;
                max=&quot;${item.max}&quot;
                step=&quot;${item.step}&quot;
                class=&quot;indicator-range inst-slider&quot;
              /&gt;
            &lt;/div&gt;
          `;
        });

        card.innerHTML = `
          &lt;div&gt;
            &lt;div class=&quot;mb-3&quot;&gt;
              &lt;h3 class=&quot;text-xs font-bold text-slate-900 tracking-wide&quot;&gt;${group.title}&lt;/h3&gt;
              &lt;p class=&quot;text-[11px] text-slate-400 mt-0.5&quot;&gt;${group.subtitle}&lt;/p&gt;
            &lt;/div&gt;
            &lt;div&gt;${itemsHtml}&lt;/div&gt;
          &lt;/div&gt;
        `;
        container.appendChild(card);
      });

      // 绑定滑块与数字输入事件
      document.querySelectorAll(&#39;.indicator-range&#39;).forEach((el) =&gt; {
        el.addEventListener(&#39;input&#39;, (e) =&gt; {
          const key = e.target.dataset.key;
          const val = parseFloat(e.target.value);
          if (!isNaN(val)) {
            state[key] = val;
            activeScenarioKey = null;
            updateDashboard();
          }
        });
      });

      document.querySelectorAll(&#39;.indicator-num&#39;).forEach((el) =&gt; {
        el.addEventListener(&#39;change&#39;, (e) =&gt; {
          const key = e.target.dataset.key;
          const meta = findIndicatorMeta(key);
          let val = parseFloat(e.target.value);
          if (isNaN(val)) val = state[key];
          if (meta) val = clamp(val, meta.min, meta.max);
          state[key] = val;
          activeScenarioKey = null;
          updateDashboard();
        });
      });
    }

    function findIndicatorMeta(key) {
      for (const g of INDICATOR_GROUPS) {
        const found = g.items.find((i) =&gt; i.key === key);
        if (found) return found;
      }
      return null;
    }

    // 9. 更新水位条几何位置（以 50% 为零轴）
    function updateZeroCenteredBar(barId, value, maxAbs) {
      const bar = document.getElementById(barId);
      if (!bar) return;
      const clamped = clamp(value, -maxAbs, maxAbs);
      const pct = (Math.abs(clamped) / maxAbs) * 50;

      if (clamped &lt; 0) {
        bar.style.left = `${50 - pct}%`;
        bar.style.width = `${pct}%`;
        bar.className = &#39;absolute inset-y-0.5 bg-red-600/85 transition-all duration-300 rounded-l-sm&#39;;
      } else {
        bar.style.left = &#39;50%&#39;;
        bar.style.width = `${pct}%`;
        bar.className = &#39;absolute inset-y-0.5 bg-emerald-600/85 transition-all duration-300 rounded-r-sm&#39;;
      }
    }

    // 10. 全局状态同步与 UI 刷新引擎
    function updateDashboard() {
      try {
        const s = state;

        // A. 更新情景按钮激活态
        document.querySelectorAll(&#39;.scenario-btn&#39;).forEach((btn) =&gt; {
          const isAct = btn.dataset.scenario === activeScenarioKey;
          if (isAct) {
            btn.className = &#39;scenario-btn px-3 py-1.5 rounded-md text-xs font-semibold border bg-slate-900 text-white border-slate-900 shadow-sm transition-colors&#39;;
          } else {
            btn.className = &#39;scenario-btn px-3 py-1.5 rounded-md text-xs font-medium border bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-slate-900 transition-colors&#39;;
          }
        });

        // B. 更新综合压力指数与阶段徽章
        const stress = computeStressIndex(s);
        const regime = detectRegime(s);

        const scoreEl = document.getElementById(&#39;stress-score&#39;);
        const barEl = document.getElementById(&#39;stress-bar&#39;);
        scoreEl.textContent = stress;
        barEl.style.width = `${stress}%`;

        if (stress &gt;= 70) {
          scoreEl.className = &#39;text-2xl font-bold tabular-nums leading-none text-red-600&#39;;
          barEl.className = &#39;h-full bg-red-600 transition-all duration-300 rounded-full&#39;;
        } else if (stress &gt;= 40) {
          scoreEl.className = &#39;text-2xl font-bold tabular-nums leading-none text-amber-600&#39;;
          barEl.className = &#39;h-full bg-amber-500 transition-all duration-300 rounded-full&#39;;
        } else {
          scoreEl.className = &#39;text-2xl font-bold tabular-nums leading-none text-emerald-600&#39;;
          barEl.className = &#39;h-full bg-emerald-600 transition-all duration-300 rounded-full&#39;;
        }

        const badgeBox = document.getElementById(&#39;regime-badge-box&#39;);
        const badgeDot = document.getElementById(&#39;regime-dot&#39;);
        const badgeTitle = document.getElementById(&#39;regime-title&#39;);
        badgeTitle.textContent = regime.title;

        const colorMap = {
          red: { box: &#39;bg-red-50 border-red-200&#39;, dot: &#39;bg-red-600&#39;, text: &#39;text-red-700&#39; },
          amber: { box: &#39;bg-amber-50 border-amber-200&#39;, dot: &#39;bg-amber-500&#39;, text: &#39;text-amber-800&#39; },
          green: { box: &#39;bg-emerald-50 border-emerald-200&#39;, dot: &#39;bg-emerald-600&#39;, text: &#39;text-emerald-800&#39; },
          blue: { box: &#39;bg-blue-50 border-blue-200&#39;, dot: &#39;bg-blue-700&#39;, text: &#39;text-blue-900&#39; }
        };
        const c = colorMap[regime.color];
        badgeBox.className = `border rounded-lg px-3.5 py-2 ${c.box}`;
        badgeDot.className = `w-2 h-2 rounded-full ${c.dot}`;
        badgeTitle.className = `text-sm font-bold leading-none ${c.text}`;

        // 宏观全面防御提示胶囊
        const macroPill = document.getElementById(&#39;macro-defense-pill&#39;);
        if (regime.macroDefense) {
          macroPill.classList.remove(&#39;hidden&#39;);
        } else {
          macroPill.classList.add(&#39;hidden&#39;);
        }

        // C. 高亮四阶段流程卡片
        document.querySelectorAll(&#39;.stage-card&#39;).forEach((card) =&gt; {
          const stNum = parseInt(card.dataset.stage, 10);
          const pill = card.querySelector(&#39;.stage-pill&#39;);
          if (stNum === regime.stage) {
            const activeStyles = {
              1: &#39;border-emerald-500 bg-emerald-50/40 ring-1 ring-emerald-500/30&#39;,
              2: &#39;border-amber-500 bg-amber-50/40 ring-1 ring-amber-500/30&#39;,
              3: &#39;border-red-600 bg-red-50/40 ring-1 ring-red-600/30&#39;,
              4: &#39;border-blue-700 bg-blue-50/40 ring-1 ring-blue-700/30&#39;
            };
            const pillStyles = {
              1: &#39;bg-emerald-600 text-white&#39;,
              2: &#39;bg-amber-500 text-white&#39;,
              3: &#39;bg-red-600 text-white&#39;,
              4: &#39;bg-blue-800 text-white&#39;
            };
            card.className = `stage-card rounded-lg border p-3 transition-all ${activeStyles[stNum]}`;
            pill.className = `stage-pill text-[11px] font-semibold px-2 py-0.5 rounded ${pillStyles[stNum]}`;
            pill.textContent = &#39;当前激活&#39;;
          } else {
            card.className = &#39;stage-card rounded-lg border border-slate-200 bg-white p-3 opacity-75 transition-all&#39;;
            pill.className = &#39;stage-pill text-[11px] font-medium px-2 py-0.5 rounded bg-slate-100 text-slate-500&#39;;
            pill.textContent = stNum &lt; regime.stage ? &#39;已演进&#39; : &#39;观察中&#39;;
          }
        });

        // D. 同步所有指标输入框、滑块与状态灯
        INDICATOR_GROUPS.forEach((group) =&gt; {
          group.items.forEach((item) =&gt; {
            const val = s[item.key];
            const numEl = document.getElementById(`num-${item.key}`);
            const rangeEl = document.getElementById(`range-${item.key}`);
            const dotEl = document.getElementById(`dot-${item.key}`);
            const badgeEl = document.getElementById(`badge-${item.key}`);

            if (numEl &amp;&amp; document.activeElement !== numEl) {
              numEl.value = val.toFixed(item.decimals);
            }
            if (rangeEl) {
              rangeEl.value = val;
            }

            const status = item.evalStatus(val, s);
            if (status === &#39;red&#39;) {
              dotEl.className = &#39;w-2 h-2 rounded-full shrink-0 bg-red-600&#39;;
              badgeEl.className = &#39;text-[10px] font-semibold px-1.5 py-0.5 rounded border whitespace-nowrap w-14 text-center bg-red-50 text-red-700 border-red-200&#39;;
              badgeEl.textContent = &#39;触发红线&#39;;
            } else if (status === &#39;amber&#39;) {
              dotEl.className = &#39;w-2 h-2 rounded-full shrink-0 bg-amber-500&#39;;
              badgeEl.className = &#39;text-[10px] font-semibold px-1.5 py-0.5 rounded border whitespace-nowrap w-14 text-center bg-amber-50 text-amber-800 border-amber-200&#39;;
              badgeEl.textContent = &#39;警戒&#39;;
            } else {
              dotEl.className = &#39;w-2 h-2 rounded-full shrink-0 bg-emerald-500&#39;;
              badgeEl.className = &#39;text-[10px] font-semibold px-1.5 py-0.5 rounded border whitespace-nowrap w-14 text-center bg-emerald-50 text-emerald-700 border-emerald-200&#39;;
              badgeEl.textContent = &#39;正常&#39;;
            }
          });
        });

        // E. 更新图表 1：波动率期限结构
        const vix9d = Number((s.vix * s.vix9dVix).toFixed(1));
        const vix30 = Number(s.vix.toFixed(1));
        const vxv = Number((s.vix / s.vixVxv).toFixed(1));

        document.getElementById(&#39;calc-vix9d&#39;).textContent = vix9d.toFixed(1);
        document.getElementById(&#39;calc-vix30&#39;).textContent = vix30.toFixed(1);
        document.getElementById(&#39;calc-vxv&#39;).textContent = vxv.toFixed(1);

        const isBackwardation = s.vixVxv &gt; 1.0 || s.vix9dVix &gt; 1.0;
        const termBadge = document.getElementById(&#39;term-structure-badge&#39;);
        if (isBackwardation) {
          termBadge.textContent = &#39;Backwardation 倒挂&#39;;
          termBadge.className = &#39;shrink-0 text-[11px] font-semibold px-2 py-0.5 rounded border bg-red-50 text-red-700 border-red-200&#39;;
        } else {
          termBadge.textContent = &#39;Contango 升水&#39;;
          termBadge.className = &#39;shrink-0 text-[11px] font-semibold px-2 py-0.5 rounded border bg-emerald-50 text-emerald-700 border-emerald-200&#39;;
        }

        if (termChart) {
          const lineColor = isBackwardation ? &#39;#DC2626&#39; : &#39;#059669&#39;;
          const fillColor = isBackwardation ? &#39;rgba(220, 38, 38, 0.08)&#39; : &#39;rgba(5, 150, 105, 0.08)&#39;;
          termChart.data.datasets[0].data = [vix9d, vix30, vxv];
          termChart.data.datasets[0].borderColor = lineColor;
          termChart.data.datasets[0].pointBorderColor = lineColor;
          termChart.data.datasets[0].backgroundColor = fillColor;
          termChart.update(&#39;none&#39;);
        }

        // F. 更新图表 2：期权流量扩散对比
        if (flowChart) {
          flowChart.data.datasets[0].data = [s.pcEquity, s.pcTotal, s.pcIndex];
          flowChart.update(&#39;none&#39;);
        }

        const flowBadge = document.getElementById(&#39;flow-status-badge&#39;);
        const flowPattern = document.getElementById(&#39;flow-pattern-text&#39;);
        if (s.pcIndex &gt;= 1.25 &amp;&amp; s.pcEquity &gt;= 0.80) {
          flowBadge.textContent = &#39;宏观全面防御&#39;;
          flowBadge.className = &#39;shrink-0 text-[11px] font-semibold px-2 py-0.5 rounded border bg-red-50 text-red-700 border-red-200&#39;;
          flowPattern.textContent = &#39;个股与机构指数共振，全面防御模式落地&#39;;
        } else if (s.pcEquity &gt;= 0.68 || s.pcTotal &gt;= 1.00) {
          flowBadge.textContent = &#39;个股率先发力&#39;;
          flowBadge.className = &#39;shrink-0 text-[11px] font-semibold px-2 py-0.5 rounded border bg-amber-50 text-amber-800 border-amber-200&#39;;
          flowPattern.textContent = &#39;接近 2022 年初个股率先抬头特征&#39;;
        } else {
          flowBadge.textContent = &#39;结构平稳&#39;;
          flowBadge.className = &#39;shrink-0 text-[11px] font-semibold px-2 py-0.5 rounded border bg-emerald-50 text-emerald-700 border-emerald-200&#39;;
          flowPattern.textContent = &#39;个股 Call 拥挤，指数常规对冲&#39;;
        }

        // G. 更新图表 3：做市商库存水位条
        const dealerValEl = document.getElementById(&#39;gauge-dealer-val&#39;);
        const gexValEl = document.getElementById(&#39;gauge-gex-val&#39;);
        const deltaValEl = document.getElementById(&#39;gauge-delta-val&#39;);
        const dealerBadge = document.getElementById(&#39;dealer-status-badge&#39;);
        const bufferEl = document.getElementById(&#39;dealer-buffer-text&#39;);

        dealerValEl.textContent = `${s.dealerGamma &gt; 0 ? &#39;+&#39; : &#39;&#39;}${s.dealerGamma.toFixed(1)} $B`;
        dealerValEl.className = `font-bold tabular-nums ${s.dealerGamma &lt; 0 ? &#39;text-red-600&#39; : &#39;text-emerald-600&#39;}`;

        gexValEl.textContent = `${s.spxGex &lt; 0 ? &#39;-$&#39; : &#39;+$&#39;}${Math.abs(s.spxGex).toFixed(1)}B`;
        gexValEl.className = `font-bold tabular-nums ${s.spxGex &lt; 0 ? &#39;text-red-600&#39; : &#39;text-emerald-600&#39;}`;

        deltaValEl.textContent = `${s.netDelta &gt; 0 ? &#39;+&#39; : &#39;&#39;}${Math.round(s.netDelta)}`;
        deltaValEl.className = `font-bold tabular-nums ${s.netDelta &lt; 0 ? &#39;text-red-600&#39; : &#39;text-emerald-600&#39;}`;

        updateZeroCenteredBar(&#39;gauge-dealer-bar&#39;, s.dealerGamma, 10);
        updateZeroCenteredBar(&#39;gauge-gex-bar&#39;, s.spxGex, 130);
        updateZeroCenteredBar(&#39;gauge-delta-bar&#39;, s.netDelta, 150);

        const buffer = s.dealerGamma - (-8.6);
        if (buffer &lt;= 0) {
          bufferEl.textContent = `已跌穿底线 ${Math.abs(buffer).toFixed(1)} $B`;
          bufferEl.className = &#39;tabular-nums text-red-700 font-bold&#39;;
        } else {
          bufferEl.textContent = `+${buffer.toFixed(1)} $B`;
          bufferEl.className = `tabular-nums font-bold ${buffer &lt; 2.0 ? &#39;text-red-600&#39; : &#39;text-slate-700&#39;}`;
        }

        if (s.dealerGamma &lt;= -8.6) {
          dealerBadge.textContent = &#39;击穿历史底线&#39;;
          dealerBadge.className = &#39;shrink-0 text-[11px] font-semibold px-2 py-0.5 rounded border bg-red-100 text-red-800 border-red-300&#39;;
        } else if (s.dealerGamma &lt; 0) {
          dealerBadge.textContent = &#39;负 Gamma 加速区&#39;;
          dealerBadge.className = &#39;shrink-0 text-[11px] font-semibold px-2 py-0.5 rounded border bg-red-50 text-red-700 border-red-200&#39;;
        } else {
          dealerBadge.textContent = &#39;正 Gamma 阻尼区&#39;;
          dealerBadge.className = &#39;shrink-0 text-[11px] font-semibold px-2 py-0.5 rounded border bg-emerald-50 text-emerald-700 border-emerald-200&#39;;
        }

        // H. 更新每日复盘 Checklist 自动触发高亮
        let riskTriggeredCount = 0;
        CHECKLIST_RISK.forEach((item) =&gt; {
          const triggered = item.checkAuto(s);
          if (triggered) riskTriggeredCount++;
          const row = document.getElementById(`row-${item.id}`);
          const autoBadge = document.getElementById(`auto-${item.id}`);
          const chk = document.getElementById(`chk-${item.id}`);

          // 若用户未手动干预，默认跟随自动触发态勾选方便复盘
          if (manualChecklistState[item.id] === undefined) {
            chk.checked = triggered;
          }

          if (triggered) {
            row.className = &#39;flex items-start gap-2.5 p-2.5 rounded-md border bg-red-50/70 border-red-300 cursor-pointer transition-colors&#39;;
            autoBadge.className = &#39;text-[10px] font-semibold px-1.5 py-0.5 rounded border shrink-0 bg-red-600 text-white border-red-600&#39;;
            autoBadge.textContent = &#39;指标已触发&#39;;
          } else {
            row.className = &#39;flex items-start gap-2.5 p-2.5 rounded-md border bg-white border-slate-200 cursor-pointer transition-colors hover:bg-slate-50&#39;;
            autoBadge.className = &#39;text-[10px] font-medium px-1.5 py-0.5 rounded border shrink-0 bg-slate-100 text-slate-500 border-slate-200&#39;;
            autoBadge.textContent = &#39;未触发&#39;;
          }
        });

        let resetTriggeredCount = 0;
        CHECKLIST_RESET.forEach((item) =&gt; {
          const triggered = item.checkAuto(s);
          if (triggered) resetTriggeredCount++;
          const row = document.getElementById(`row-${item.id}`);
          const autoBadge = document.getElementById(`auto-${item.id}`);
          const chk = document.getElementById(`chk-${item.id}`);

          if (manualChecklistState[item.id] === undefined) {
            chk.checked = triggered;
          }

          if (triggered) {
            row.className = &#39;flex items-start gap-2.5 p-2.5 rounded-md border bg-emerald-50/70 border-emerald-300 cursor-pointer transition-colors&#39;;
            autoBadge.className = &#39;text-[10px] font-semibold px-1.5 py-0.5 rounded border shrink-0 bg-emerald-600 text-white border-emerald-600&#39;;
            autoBadge.textContent = &#39;条件满足&#39;;
          } else {
            row.className = &#39;flex items-start gap-2.5 p-2.5 rounded-md border bg-white border-slate-200 cursor-pointer transition-colors hover:bg-slate-50&#39;;
            autoBadge.className = &#39;text-[10px] font-medium px-1.5 py-0.5 rounded border shrink-0 bg-slate-100 text-slate-500 border-slate-200&#39;;
            autoBadge.textContent = &#39;未满足&#39;;
          }
        });

        document.getElementById(&#39;checklist-risk-count&#39;).textContent = `风险触发: ${riskTriggeredCount}/4`;
        document.getElementById(&#39;checklist-reset-count&#39;).textContent = `修复触发: ${resetTriggeredCount}/4`;

      } catch (err) {
        console.error(&#39;Update dashboard error:&#39;, err);
      }
    }

    // 11. 加载预设情景
    function applyScenario(key) {
      const preset = SCENARIOS[key];
      if (!preset) return;
      state = { ...preset.values };
      activeScenarioKey = key;
      manualChecklistState = {}; // 切换情景时恢复自动勾选联动
      updateDashboard();
      showToast(`已切换至：${preset.label}`);
    }

    // 12. 绑定全局事件与启动入口
    window.addEventListener(&#39;DOMContentLoaded&#39;, () =&gt; {
      buildIndicatorPanels();
      buildChecklists();
      initCharts();

      // 情景按钮点击
      document.querySelectorAll(&#39;.scenario-btn&#39;).forEach((btn) =&gt; {
        btn.addEventListener(&#39;click&#39;, () =&gt; {
          applyScenario(btn.dataset.scenario);
        });
      });

      // 重置按钮点击
      document.getElementById(&#39;btn-reset&#39;).addEventListener(&#39;click&#39;, () =&gt; {
        applyScenario(&#39;current&#39;);
      });

      // 首次渲染（默认加载 11/19 OPEX 前实盘数据）
      updateDashboard();
    });
  &lt;/script&gt;
